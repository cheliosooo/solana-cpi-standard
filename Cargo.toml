[workspace]
members = ["crates/*", "programs/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
solana-cpi-standard-core = { path = "crates/core", version = "0.1.0" }
borsh = "0.10.4"
solana-pubkey = { version = "2.1", features = ["std"] }
solana-instruction = "2.1"
solana-account-info = "2.1"
solana-program-error = "2.1"
solana-cpi = "2.1"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
